<section class="post-common-footer" id="postCommonFooter">
  <button class="post-back-to-top" id="postBackToTop" type="button" aria-label="Back to top">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M12 19V5M6 11l6-6 6 6" />
    </svg>
  </button>
  <p class="post-common-copyright">
    &copy; Copyright {{ site.time | date: '%Y' }} Bumjin Park. {{ site.footer_text }}
  </p>
</section>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    var backToTopButton = document.getElementById('postBackToTop');
    if (!backToTopButton) return;

    backToTopButton.addEventListener('click', function () {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });
</script>
